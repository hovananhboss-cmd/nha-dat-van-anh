name: Chẩn đoán máy chủ Overpass (tạm thời)
on:
  push:
    branches: [claude/github-map-location-repos-antscm]
    paths: ['.github/workflows/diag-overpass.yml', '.github/diag-query.txt']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gọi từng máy chủ Overpass như trình duyệt
        run: |
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "=== $u"
            curl -s -m 60 -o out.json -D h.txt -w 'HTTP %{http_code} time %{time_total}s size %{size_download}\n' \
              -H 'Origin: https://hovananhboss-cmd.github.io' -H 'Referer: https://hovananhboss-cmd.github.io/nha-dat-van-anh/' \
              -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile Safari/604.1' \
              --data-urlencode "data@.github/diag-query.txt" "$u" || echo "curl lỗi $?"
            grep -i 'access-control-allow-origin' h.txt || echo "(không có CORS header)"
            head -c 300 out.json; echo
            python3 -c "import json;d=json.load(open('out.json'));print('elements',len(d.get('elements',[])))" 2>/dev/null || true
          done
